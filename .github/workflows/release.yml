name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: windows-11-vs2026-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            aqt_source: git+https://github.com/miurahr/aqtinstall.git

          - arch: x64
            runner: windows-2025-vs2026
            qt_host: windows
            qt_arch: win64_msvc2022_64
            aqt_source: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
          aqtsource: ${{ matrix.aqt_source }}

      - name: Configure
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release "-DRIP_PACKAGE_VERSION=$env:RELEASE_TAG"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $tests = @(
            "build/Release/rip-token-codec-test.exe",
            "build/Release/rip-token-huffman-test.exe",
            "build/Release/rip-compression-test.exe"
          )

          foreach ($test in $tests) {
            Write-Host "Running $test"
            & $test

            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $test"
            }
          }

      - name: Package standalone Windows build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          WINDOWS_ARCH: ${{ matrix.arch }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $arch = $env:WINDOWS_ARCH.ToLowerInvariant()
          $stage = Join-Path $PWD "build/package/rip-$version-windows-$arch"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item "build/Release/rip.exe" $stage
          Copy-Item "build/Release/rip-gui.exe" $stage
          Copy-Item "build/Release/gui" $stage -Recurse

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --dir "$stage" "$stage/rip-gui.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          $requiredFiles = @(
            "rip.exe",
            "rip-gui.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6WebEngineCore.dll",
            "Qt6WebEngineWidgets.dll",
            "QtWebEngineProcess.exe",
            "resources/qtwebengine_resources.pak"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path (Join-Path $stage $file))) {
              throw "Required standalone runtime file is missing: $file"
            }
          }

          $platformPlugin = @(
            (Join-Path $stage "platforms/qwindows.dll"),
            (Join-Path $stage "plugins/platforms/qwindows.dll")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (!$platformPlugin) {
            throw "The Qt Windows platform plugin (qwindows.dll) was not deployed."
          }

          @"
          RIP $version for Windows ($arch)

          Both the command-line utility (rip.exe) and GUI (rip-gui.exe) are included.
          Qt libraries, the Windows platform plugin, and Qt WebEngine runtime files are bundled.
          A separate Qt installation is not required.
          "@ | Set-Content (Join-Path $stage "README-Windows.txt") -Encoding utf8

          $zip = Join-Path $PWD "build/rip-$version-windows-$arch.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "Windows release ZIP was not created: $zip"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rip-windows-${{ matrix.arch }}
          path: build/rip-*-windows-*.zip
          if-no-files-found: error

  linux:
    name: Build Linux ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git \
            qt6-base-dev \
            qt6-webengine-dev \
            qt6-webchannel-dev

      - name: Configure
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIP_PACKAGE_VERSION="$RELEASE_TAG"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        shell: bash
        run: |
          set -e
          ./build/rip-token-codec-test
          ./build/rip-token-huffman-test
          ./build/rip-compression-test

      - name: Package
        run: cmake --build build --target package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rip-linux-${{ matrix.arch }}
          path: build/rip-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release

    needs:
      - windows
      - linux

    runs-on: ubuntu-24.04

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/*.zip
            release/**/*.tar.gz