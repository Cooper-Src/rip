name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: windows-11-vs2026-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            aqt_source: git+https://github.com/miurahr/aqtinstall.git

          - arch: x64
            runner: windows-2025-vs2026
            qt_host: windows
            qt_arch: win64_msvc2022_64
            aqt_source: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
          aqtsource: ${{ matrix.aqt_source }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $tests = @(
            "build/Release/rip-token-codec-test.exe",
            "build/Release/rip-token-huffman-test.exe",
            "build/Release/rip-compression-test.exe"
          )

          foreach ($test in $tests) {
            Write-Host "Running $test"
            & $test

            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $test"
            }
          }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "build/Release/rip-gui.exe"

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rip-windows-${{ matrix.arch }}
          path: build/rip-*-windows-*.zip
          if-no-files-found: error

  linux:
    name: Build Linux ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git \
            qt6-base-dev \
            qt6-webengine-dev \
            qt6-webchannel-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        shell: bash
        run: |
          set -e
          ./build/rip-token-codec-test
          ./build/rip-token-huffman-test
          ./build/rip-compression-test

      - name: Package
        run: cmake --build build --target package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rip-linux-${{ matrix.arch }}
          path: build/rip-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release

    needs:
      - windows
      - linux

    runs-on: ubuntu-24.04

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.zip
            release/**/*.tar.gz