name: RIPC compression tests

on:
  push:
    branches:
      - main
    paths:
      - "RELEASE_VERSION"
      - "installer/**"
      - ".github/workflows/release.yml"
      - "include/rip/compression.hpp"
      - "include/rip/token_codec.hpp"
      - "include/rip/token_huffman.hpp"
      - "src/compression.cpp"
      - "src/compression_test.cpp"
      - "src/compression_bench.cpp"
      - "src/token_codec.cpp"
      - "src/token_huffman.cpp"
      - "src/archive.cpp"
      - "src/main.cpp"
      - "include/rip/archive.hpp"
      - "include/rip/format.hpp"
      - "src/gui_main.cpp"
      - "gui/src/**"
      - "gui/package.json"
      - "gui/package-lock.json"
      - "gui/dist/**"
      - "CMakeLists.txt"
      - ".github/workflows/ripc-test.yml"
  pull_request:
    paths:
      - "RELEASE_VERSION"
      - "installer/**"
      - ".github/workflows/release.yml"
      - "include/rip/compression.hpp"
      - "include/rip/token_codec.hpp"
      - "include/rip/token_huffman.hpp"
      - "src/compression.cpp"
      - "src/compression_test.cpp"
      - "src/compression_bench.cpp"
      - "src/token_codec.cpp"
      - "src/token_huffman.cpp"
      - "src/archive.cpp"
      - "src/main.cpp"
      - "include/rip/archive.hpp"
      - "include/rip/format.hpp"
      - "src/gui_main.cpp"
      - "gui/src/**"
      - "gui/package.json"
      - "gui/package-lock.json"
      - "gui/dist/**"
      - "CMakeLists.txt"
      - ".github/workflows/ripc-test.yml"

jobs:
  frontend:
    name: Build GUI frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI frontend
        working-directory: gui
        run: npm run build

  installer-compile:
    name: Compile Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile both installer architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $versionLine = Select-String -Path "CMakeLists.txt" -Pattern '^\s*VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          if (!$versionLine) { throw "Unable to read project version from CMakeLists.txt." }
          $version = $versionLine.Matches[0].Groups[1].Value

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (!$iscc) { throw "Inno Setup Compiler (ISCC.exe) was not found." }

          foreach ($arch in @("x64", "arm64")) {
            $stage = Join-Path $PWD "build/package/rip-$version-windows-$arch"
            New-Item -ItemType Directory -Path (Join-Path $stage "gui") -Force | Out-Null

            # Minimal fixture files verify script syntax and both architecture configurations.
            Set-Content -Path (Join-Path $stage "rip.exe") -Value "RIP installer fixture" -Encoding ascii
            Set-Content -Path (Join-Path $stage "rip-gui.exe") -Value "RIP GUI installer fixture" -Encoding ascii
            Set-Content -Path (Join-Path $stage "gui/index.html") -Value "<!doctype html><title>RIP</title>" -Encoding utf8
            Set-Content -Path (Join-Path $stage "README-Windows.txt") -Value "RIP installer fixture" -Encoding utf8

            $allowedArchitecture = if ($arch -eq "arm64") { "arm64" } else { "x64compatible" }
            & $iscc "/DAppVersion=$version" "/DAppArch=$arch" "/DArchitectureAllowed=$allowedArchitecture" "/DArchitectureInstallMode=$allowedArchitecture" "installer/rip.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for $arch." }

            $setup = Join-Path $PWD "build/installer/rip-$version-windows-$arch-setup.exe"
            if (!(Test-Path $setup)) { throw "Expected installer output missing: $setup" }
            Write-Host "Compiled $setup"
          }

  compression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RIPC tests and benchmark
        run: |
          c++ --version
          c++ -std=c++23 -O2 -pthread -Wall -Wextra -Wpedantic \
            -Iinclude \
            src/compression_test.cpp \
            src/compression.cpp \
            src/token_codec.cpp \
            src/token_huffman.cpp \
            -lz \
            -o rip-compression-test

          c++ -std=c++23 -O2 -pthread -Wall -Wextra -Wpedantic \
            -Iinclude \
            src/compression_bench.cpp \
            src/compression.cpp \
            src/token_codec.cpp \
            src/token_huffman.cpp \
            -lz \
            -o rip-compression-bench

      - name: Run round-trip tests
        run: ./rip-compression-test

      - name: Run benchmark
        run: ./rip-compression-bench

      - name: Build archive CLI
        run: |
          c++ -std=c++23 -O2 -pthread -Wall -Wextra -Wpedantic             -Iinclude             src/main.cpp             src/archive.cpp             src/crc32.cpp             src/compression.cpp             src/token_codec.cpp             src/token_huffman.cpp             -lz             -o rip

      - name: Test solid RIPC archive round trip
        run: |
          set -eux
          rm -rf archive-solid-test archive-solid-out solid-test.rip
          mkdir -p archive-solid-test/one archive-solid-test/two

          printf '%s\n' \
            'shared source text repeated across archive files' \
            'shared source text repeated across archive files' \
            'shared source text repeated across archive files' \
            > archive-solid-test/one/first.txt

          printf '%s\n' \
            'shared source text repeated across archive files' \
            'shared source text repeated across archive files' \
            'shared source text repeated across archive files' \
            > archive-solid-test/two/second.txt

          ./rip create solid-test.rip archive-solid-test
          ./rip list solid-test.rip
          ./rip test solid-test.rip
          ./rip extract solid-test.rip archive-solid-out

          cmp archive-solid-test/one/first.txt archive-solid-out/one/first.txt
          cmp archive-solid-test/two/second.txt archive-solid-out/two/second.txt
