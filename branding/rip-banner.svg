<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RIP — Archive Toolkit</title>
  <desc id="desc">A modern archive utility for packing, protecting and unpacking files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#1D2A40"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8FFA0"/><stop offset="1" stop-color="#A7E64A"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#DDE7F5" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="54" r="180" fill="#C7F36B" opacity=".055"/>
  <circle cx="1002" cy="334" r="220" fill="#4B88C7" opacity=".08"/>
  <g transform="translate(72 72) scale(2.8)">
