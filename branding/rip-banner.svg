    <path d="M13.5 19 32 10.5 50.5 19 32 27.5Z" fill="#F4F7FB"/>
    <path d="M13.5 24.5 32 33 50.5 24.5V43L32 52 13.5 43Z" fill="#253247" stroke="#F4F7FB" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M13.8 31 32 39.5 50.2 31" fill="none" stroke="url(#lime)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M13.8 39 32 47.5 50.2 39" fill="none" stroke="#F4F7FB" stroke-opacity=".92" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M32 10.5V18" stroke="#101828" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="310" y="160" fill="#F4F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="86" font-weight="850" letter-spacing="-4">RIP</text>
  <rect x="314" y="181" width="8" height="50" rx="4" fill="url(#lime)"/>
  <text x="342" y="203" fill="#C7F36B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" letter-spacing="5">ARCHIVE TOOLKIT</text>
  <text x="314" y="269" fill="#C5D0DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="450">Pack. Protect. Unpack.</text>
  <text x="314" y="307" fill="#92A2B9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">A custom archive format and compression engine for Windows and Linux.</text>
